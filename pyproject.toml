[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epoch-diabetes-readmission"
version = "1.0.0"
description = "EPOCH Datathon 2026 - interpretable 30-day readmission risk prototype (diabetes theme)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4,<1.7", "matplotlib>=3.7", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning", "ignore:Found unknown categories"]
